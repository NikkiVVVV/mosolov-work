name: Check bookmark bot
on:
  push:
    paths:
      - 'services/bookmark-bot/**'
      - '.github/workflows/bookmark-bot-tests.yml'
  pull_request:
    paths:
      - 'services/bookmark-bot/**'
      - '.github/workflows/bookmark-bot-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s services/bookmark-bot -p 'test_*.py'
      - run: node services/bookmark-bot/test_widget.cjs
