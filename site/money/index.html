<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><title>Орёл или решка</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f8f6}body{font-family:'Helvetica Neue',Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}main{position:relative;width:100%;height:100svh;min-height:360px;background:radial-gradient(ellipse at 50% 38%,#fff 15%,#f8f8f6 65%,#eeefeb)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shadow{position:absolute;top:calc(50% + 66px);left:50%;width:140px;height:20px;margin-left:-70px;border-radius:50%;background:radial-gradient(ellipse,#4d514026,transparent 70%);filter:blur(5px);pointer-events:none}.result{position:absolute;top:calc(50% + 112px);left:0;width:100%;margin:0;text-align:center;font-size:24px;font-weight:500;line-height:32px;letter-spacing:-1px;color:#686c63;opacity:0;pointer-events:none}button{position:absolute;left:50%;top:calc(50% + 180px);transform:translateX(-50%);isolation:isolate;overflow:hidden;min-width:164px;height:52px;padding:0 28px;border:1px solid #fff;border-radius:28px;background:linear-gradient(#fff,#e8eae4);box-shadow:0 4px 12px #424b3410,inset 0 -1px 2px #66705515;font:500 15px/20px 'Helvetica Neue',Helvetica,sans-serif;color:#454b40;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .2s,opacity .2s}button:before{content:'';position:absolute;inset:0;background:#c5cbb9;opacity:.45;transform:scaleX(var(--charge,0));transform-origin:left;z-index:-1}button.charging{box-shadow:0 1px 4px #424b3410,inset 0 2px 6px #66705520}button:focus-visible{outline:2px solid #737d68;outline-offset:5px}button:disabled{opacity:.55;cursor:default}.coin-touch{position:absolute;left:50%;top:calc(50% - 152px);width:280px;height:280px;transform:translateX(-50%);touch-action:none;cursor:grab;user-select:none}.coin-touch:active{cursor:grabbing}.fallback{display:none;position:absolute;width:180px;left:50%;top:calc(50% - 112px);transform:translateX(-50%)}@media(max-height:550px){button{top:auto;bottom:24px}.result{top:calc(50% + 96px)}}
</style></head><body><main><div class="shadow"></div><div class="coin-touch" aria-label="Вращайте монету пальцем. Смахните вверх, чтобы подбросить"></div><img class="fallback" src="assets/heads.webp" alt="Монета"><p class="result" role="status" aria-live="polite"></p><button type="button" disabled aria-label="Подбросить. Удерживайте для более высокого броска">Подбросить</button></main><script type="module" src="app.js"></script></body></html>
