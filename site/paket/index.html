<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8fc">
  <meta name="description" content="Тот самый пакет «Эртильские новости», который путешествует вместе с нами.">
  <title>Тот самый пакет</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='27' rx='2' fill='%23fff' stroke='%23125085' stroke-width='2'/%3E%3Crect x='12' y='6' width='8' height='3' rx='1.5' fill='%23125085'/%3E%3Cpath d='M10 17h12v7H10z' fill='%23125085'/%3E%3C/svg%3E">
  <script>
    (()=>{const root=document.documentElement;
      if((!location.hash||location.hash==='#hero')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        root.dataset.intro='pending';
        setTimeout(()=>{if(root.dataset.intro!=='done'){root.dataset.intro='done';window.dispatchEvent(new Event('bag-ready'));}},5500);
      }else root.dataset.intro='done';
    })();
  </script>
  <link rel="preload" href="./assets/bag-mobile.webp" as="image">
  <link rel="stylesheet" href="./styles.css?v=20261002-footer-spacing">
  <link rel="preload" href="./assets/fonts/Commissioner-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/NKDuyMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main class="mobile-page">
    <section id="hero" class="hero" aria-label="Пакет «Эртильские новости»">
      <div class="scene-frame" id="scene-frame">
      <h1 class="sr-only">Пакет, который путешествует</h1>
      <div class="bag-stage" id="bag-stage" role="group" aria-label="Пакет на светлом фоне" data-environment="plain">
        <img id="bag-fallback" class="bag-fallback" src="./assets/bag-mobile.webp" width="768" height="1024" alt="Белый пакет «Эртильские новости», 75 лет, Вместе с читателем!" draggable="false" fetchpriority="high">
      </div>
  <div id="bag-shadow" aria-hidden="true"></div>
  <canvas id="bag-canvas" aria-hidden="true"></canvas>
  <div id="bag-hit-area" tabindex="0" role="img" aria-label="Интерактивный пакет. Тяните мышью или пальцем, чтобы смять. Пакет медленно распрямляется после отпускания. Стрелки двигают складку, Escape расправляет пакет."></div>
      </div>
      <div class="scene-controls">
      <fieldset class="scene-picker">
        <legend class="sr-only">Фон пакета</legend>
        <label class="scene-option"><input type="radio" name="bag-environment" value="plain" aria-label="Светлый фон" checked></label>
        <label class="scene-option"><input type="radio" name="bag-environment" value="sea" aria-label="Вода"></label>
        <label class="scene-option"><input type="radio" name="bag-environment" value="rocks" aria-label="Камни"></label>
        <label class="scene-option"><input type="radio" name="bag-environment" value="space" aria-label="Космос"></label>
      </fieldset>
      <a class="album-link" href="#story">О пакете <svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </section>
    <section id="story" class="story section" aria-label="История пакета" hidden></section>
    <!-- Sections are populated only when real content is available. No invented travel archive. -->
    <section id="album" class="album section" aria-label="Альбом путешествий"></section>
    <section id="facts" class="facts" aria-label="Факты о путешествиях" hidden></section>
    <section id="merch" class="merch section" aria-label="Мерч" hidden></section>
    <footer class="site-footer" aria-label="Ссылки">
      <a id="footer-channel" class="footer-channel" href="https://t.me/nikir_public" target="_blank" rel="noopener noreferrer">mosolov/saved</a>
      <img class="footer-sticker" src="./assets/footer-sticker-15.webp" width="640" height="386" alt="Пакет, который путешествует" loading="lazy" decoding="async">
      <a href="#hero">Наверх ↑</a>
    </footer>
  </main>
  <script type="module" src="./js/main.js?v=20261001-bag-surprise-final"></script>
</body>
</html>
