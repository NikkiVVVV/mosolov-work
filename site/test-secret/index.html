<!doctype html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Никита Мосолов — Product Engineer</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')==='dark'?'dark':'light'}catch{}</script>
  <script>
    document.documentElement.classList.add('is-loading');
    window.portfolioBootTimeout=setTimeout(()=>{document.documentElement.classList.remove('is-loading');document.querySelector('.layout')?.removeAttribute('inert');document.querySelector('.site-loader')?.remove();document.body.style.overflow='';},12000);
  </script>
  <style>.site-loader{display:none}.is-loading .site-loader{display:grid;position:fixed;inset:0;z-index:100;background:#fcfcfc;place-items:center}.is-loading .layout{visibility:hidden}html[data-theme=dark] .site-loader{background:#191a1b}</style>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/Werkzeug.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=cards24">
  <link rel="stylesheet" href="pendant.css?v=roll27">
  <script type="module" src="app.js?v=mobile22"></script>
  <script type="module" src="pendant.js?v=roll27"></script>
</head>
<body>
  <div class="site-loader" role="status" aria-label="Загрузка портфолио" data-phase="loading">
    <div data-loader-slot><div class="loader-shell" aria-hidden="true"></div><div class="loader-progress" role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <a class="skip-link" href="#portfolio">К работам</a>
  <header class="mobile-topbar" aria-label="Тема и связь"><div class="mobile-theme-slot"></div><div class="mobile-contact-slot"></div></header>
  <main class="layout">
    <aside class="profile" aria-label="Обо мне">
      <div class="identity">
        <div class="pendant-block" data-pendant-block>
          <div class="pendant" data-pendant><img class="pendant-poster" src="assets/pendant/clay/poster.webp" alt="Никита в подвеске"></div>
          <div class="pendant-tools"><button data-action="nudge" title="Качнуть подвеску">Качнуть</button><button data-action="spin">Оборот</button><button data-action="zoom">Ближе</button><button data-action="tilt" aria-pressed="false">Наклон телефона</button><button data-action="reset">Сбросить</button></div>
          <p class="pendant-note" role="status"></p>
        </div>
        <div class="profile-heading"><div><h1>Никита Мосолов</h1><p>Product Engineer</p></div></div>
      </div>
      <p>Проектирую и создаю цифровые продукты — от идеи до запуска. Работаю в Авито Авто.</p>
    </aside>
    <section id="portfolio" class="portfolio" aria-label="Работы">
      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Категория работ">
          <button type="button" data-filter="all" role="tab" id="tab-all" aria-controls="work-panel" tabindex="0" aria-selected="true">Все</button>
          <button type="button" data-filter="work" role="tab" id="tab-work" aria-controls="work-panel" tabindex="-1" aria-selected="false">Работа</button>
          <button type="button" data-filter="pet" role="tab" id="tab-pet" aria-controls="work-panel" tabindex="-1" aria-selected="false">Пет-проекты</button>
          <button type="button" data-filter="publication" role="tab" id="tab-publication" aria-controls="work-panel" tabindex="-1" aria-selected="false">Публикации</button>
        </div>
        <button type="button" class="contact-button" id="open-contact" aria-haspopup="dialog">Связь</button>
        <div class="view-toggle" hidden role="group" aria-label="Режим отображения">
          <button type="button" data-view="grid" aria-label="Сетка" title="Сетка" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx=".7"/><rect x="12" y="3" width="5" height="5" rx=".7"/><rect x="3" y="12" width="5" height="5" rx=".7"/><rect x="12" y="12" width="5" height="5" rx=".7"/></svg></button>
          <button type="button" data-view="sphere" aria-label="Панорама" title="Панорама" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.3"/><ellipse cx="10" cy="10" rx="3.6" ry="7.3"/><path d="M3 10h14M4.3 5.8c3.4 1.5 8 1.5 11.4 0M4.3 14.2c3.4-1.5 8-1.5 11.4 0"/></svg></button>
        </div>
      </div>
      <div id="work-panel" role="tabpanel" aria-labelledby="tab-all">
      <div class="grid" id="grid"></div>
      <div class="sphere-panel" id="sphere-panel" hidden>
        <div class="sphere-stage" id="sphere-stage" tabindex="0" role="group" aria-label="Вогнутая панорама работ. Перемещайте перетаскиванием или стрелками." aria-describedby="sphere-hint"><canvas id="sphere-canvas" aria-hidden="true"></canvas><div id="sphere-items"></div></div>
        <div class="sphere-footer"><span id="sphere-hint">Потяни, чтобы осмотреться</span><button type="button" id="motion-toggle" aria-pressed="false">Пауза</button></div>
      </div>
      </div>
      <p class="sr-only" id="result-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="project-preview" aria-labelledby="preview-title"><div class="dialog-header"><h2 id="preview-title">Работа</h2><button type="button" id="close-preview" aria-label="Закрыть">Закрыть ×</button></div><div class="preview-cover"><span id="preview-index"></span></div><p class="meta" id="preview-meta"></p><p id="preview-description"></p></dialog>
  <dialog id="contact-dialog" aria-labelledby="contact-title">
    <div class="dialog-header"><h2 id="contact-title">Связь</h2><button type="button" id="close-contact" aria-label="Закрыть контакты"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <nav class="contact-links" aria-label="Написать Никите">
      <a href="mailto:nikkiuxi@gmail.com"><span class="contact-label">Email</span><span class="contact-value">nikkiuxi@gmail.com</span></a>
      <a href="https://t.me/nikir_public" target="_blank" rel="noopener"><span class="contact-label">Telegram</span><span class="contact-value">@nikir_public</span></a>
      <a href="https://github.com/NikkiVVVV" target="_blank" rel="noopener"><span class="contact-label">GitHub</span><span class="contact-value">NikkiVVVV</span></a>
    </nav>
  </dialog>
  <div class="theme-switch" role="group" aria-label="Тема оформления">
    <button type="button" data-theme-choice="light" aria-label="Светлая тема" title="Светлая тема" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
    <button type="button" data-theme-choice="dark" aria-label="Тёмная тема" title="Тёмная тема" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
  </div>
  <noscript><p>Для переключения режимов включите JavaScript.</p></noscript>
</body>
</html>
