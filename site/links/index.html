<!doctype html>
<html lang="ru" data-catalog="./bookmarks.json">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a1b">
  <title>Избранные закладки</title>
  <link rel="stylesheet" href="./styles.css?v=186">
  <script type="module" src="./mobile-navigation.js?v=186"></script>
  <script type="module" src="./app.js"></script>
  <link rel="stylesheet" href="/page-navigation.css?v=186">
  <script type="module" src="/page-navigation.js?v=186"></script>
</head>
<body>
  <nav class="links-mobile-bar" aria-label="Мобильная навигация">
    <a class="links-bar-icon" href="/" aria-label="На главную"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
    <div class="links-menu-backdrop" data-open="false" aria-hidden="true"></div>
    <details class="links-bar-menu">
      <summary class="links-bar-icon" aria-label="Меню"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></summary>
      <div class="links-bar-panel">
        <a href="https://t.me/nikir_public" target="_blank" rel="noopener noreferrer">ТГ-канал</a>
        <a href="https://idearadar.ru/" target="_blank" rel="noopener noreferrer">Idea Radar</a>
        <a href="https://t.me/mayonez12_bot" target="_blank" rel="noopener noreferrer">Майонез</a>
        <a href="https://idearadar.ru/experience/" target="_blank" rel="noopener noreferrer">Experience Radar</a>
      </div>
    </details>
  </nav>
  <main class="page-shell">
    <section class="search-section" aria-label="Поиск по закладкам">
      <canvas id="search-wave" aria-hidden="true"></canvas>
      <h1>Избранные<br>закладки</h1>
      <form class="search-form" role="search" id="search-form">
        <svg class="search-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.5 8 3 9.5 11 11-8 1.5-9.5 3-11 11C10.5 15 9 13.5 1 12 9 10.5 10.5 9 12 1Z"/></svg>
        <label class="sr-only" for="search">Опишите сайт, который ищете</label>
        <input id="search" name="q" type="text" autocomplete="off" spellcheck="false" placeholder="Сайты с необычной типографикой" aria-controls="chat" maxlength="500">
        <div class="search-actions">
          <button type="button" class="clear-search" id="clear-search" aria-label="Очистить поиск" hidden>×</button>
          <button class="submit-search" type="submit" aria-label="Найти сайты"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15V5m-4.5 4.5L10 5l4.5 4.5"/></svg></button>
        </div>
      </form>
      <p id="query-notice" class="query-notice" hidden>Отправляя запрос, вы передаёте его владельцу сайта в Telegram. Не вводите личные данные.</p>
    </section>
    <section id="catalog" aria-label="Сохранённые сайты">
      <div id="filters" class="filters" role="group" aria-label="Фильтры"></div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Закладки, таблица с горизонтальной прокруткой">
        <table>
          <colgroup><col class="site-column"><col class="category-column"><col></colgroup>
          <thead><tr><th scope="col">Сайт</th><th scope="col">Категория</th><th scope="col">Заметка</th></tr></thead>
          <tbody id="bookmark-list"></tbody>
        </table>
      </div>
      <p id="list-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <dialog id="chat-modal" class="chat-modal" aria-label="Поиск по закладкам">
    <header class="chat-modal-header">
      <svg class="search-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.5 8 3 9.5 11 11-8 1.5-9.5 3-11 11C10.5 15 9 13.5 1 12 9 10.5 10.5 9 12 1Z"/></svg>
      <button id="close-chat" type="button" aria-label="Закрыть чат"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="chat" class="chat" role="log" aria-label="История поиска" aria-live="polite"></div>
    <div id="chat-composer" class="chat-composer"></div>
  </dialog>
</body>
</html>
