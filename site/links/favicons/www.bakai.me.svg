<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Liquid glass bead. Three things do the work: a body gradient that runs
       bright at the top meniscus, through a black core, back up to a lit bottom
       (light passing through and bouncing off the surface below); one crisp
       specular ellipse where the key light hits; and a fresnel rim that is
       brightest top and bottom, because that is where a sphere's edge turns
       away from you and light wraps it. No blur filters — they cost more than
       they show at 16px, and Safari renders them unevenly on favicons. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#6a6a78"/>
      <stop offset="22%" stop-color="#1b1b21"/>
      <stop offset="72%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#2a2a34"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#body)"/>
  <ellipse cx="26" cy="17" rx="11" ry="5.5" fill="url(#spec)" transform="rotate(-18 26 17)"/>
  <circle cx="32" cy="32" r="30.3" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
</svg>
